name: Build Android

on: [workflow_dispatch]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Repo secrets are optional - if not set, the sample values/files in samples/android are used.
      # See samples/README.md. Do NOT publish apps signed with the sample keystore.
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
      KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS || 'custommobile' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.14.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.14.2
          cache-disabled: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Build Tools 36.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;36.0.0" "platforms;android-36" "platform-tools"

      - name: "[Log] Environment and toolchain"
        run: |
          echo "::group::Runner"
          uname -a
          cat /etc/os-release | grep PRETTY_NAME
          echo "::endgroup::"
          echo "::group::Java"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version 2>&1
          echo "::endgroup::"
          echo "::group::Gradle"
          which gradle
          gradle --version
          echo "::endgroup::"
          echo "::group::Node / npm"
          node --version
          npm --version
          echo "::endgroup::"
          echo "::group::Android SDK"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          sdkmanager --list_installed 2>/dev/null | grep -E "build-tools|platforms;|platform-tools|cmdline-tools" || true
          ls "$ANDROID_HOME/build-tools" || true
          echo "::endgroup::"

      - name: Import Android keystore and Google services JSON
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          # use repo secrets when set, otherwise fall back to the sample files (values are never printed)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "[keystore] using secret ANDROID_KEYSTORE_BASE64"
            echo -n "$KEYSTORE_BASE64" | base64 --decode > android.keystore
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set - signing with the SAMPLE keystore (samples/android/android.keystore). Do not publish this build."
            cp samples/android/android.keystore android.keystore
          fi

          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "[google-services] using secret ANDROID_GOOGLE_SERVICES_JSON_BASE64"
            echo -n "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android-google-services.json
          else
            echo "::warning::ANDROID_GOOGLE_SERVICES_JSON_BASE64 not set - using SAMPLE google-services.json (push notifications will not work)"
            cp samples/android/google-services.json android-google-services.json
          fi

          ls -l android.keystore android-google-services.json

          echo "::group::Keystore check"
          # verify password and alias match the keystore (prints alias/validity only)
          if keytool -list -keystore android.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEYSTORE_ALIAS" -v 2>&1 \
              | grep -E "Alias name|Creation date|Entry type|Valid from|Owner:"; then
            echo "Keystore and alias OK"
          else
            echo "::warning::Could not open keystore with given password/alias - signing will likely fail"
          fi
          echo "::endgroup::"

          echo "google-services.json $(grep -o '"project_id": *"[^"]*"' android-google-services.json | head -1)"

      - name: Install Cordova
        run: |
          npm install -g cordova@13.0.0
          cordova --version
          cordova telemetry off

      - name: Add Cordova Android platform
        run: cordova platform add android@15.0.0 --verbose

      - name: Add cordova-plugin-androidx-adapter
        run: cordova plugin add cordova-plugin-androidx-adapter@1.1.3

      - name: Add custom cordova-plugin-inappbrowser-download
        run: cordova plugin add ./cordova-plugin-inappbrowser-download

      - name: Add cordova-plugin-device
        run: cordova plugin add cordova-plugin-device@2.1.0

      - name: Add cordova-plugin-push
        run: cordova plugin add @havesource/cordova-plugin-push@dev

      - name: Add cordova-plugin-splashscreen
        run: cordova plugin add cordova-plugin-splashscreen@6.0.1

      - name: Add cordova-plugin-media-capture
        run: cordova plugin add cordova-plugin-media-capture@4.0.0

      - name: Add cordova-plugin-dialogs
        run: cordova plugin add cordova-plugin-dialogs@2.0.2

      - name: Add cordova-plugin-vibration
        run: cordova plugin add cordova-plugin-vibration@3.1.1

      - name: Add cordova-plugin-geolocation
        run: cordova plugin add cordova-plugin-geolocation@4.1.0

      - name: Add cordova-plugin-fingerprint-aio
        run: cordova plugin add cordova-plugin-fingerprint-aio@5.0.1

      - name: Add cordova-plugin-camera
        run: cordova plugin add cordova-plugin-camera@6.0.0

      - name: Add cordova-plugin-android-permissions
        run: cordova plugin add cordova-plugin-android-permissions@1.1.5

      - name: "[Log] Cordova project state"
        run: |
          echo "::group::cordova info"
          cordova info || true
          echo "::endgroup::"
          echo "::group::cordova platform ls"
          cordova platform ls
          echo "::endgroup::"
          echo "::group::cordova plugin ls"
          cordova plugin ls
          echo "::endgroup::"
          echo "::group::cordova requirements android"
          cordova requirements android || echo "::warning::cordova requirements reported problems"
          echo "::endgroup::"

      - name: Build Android release APK
        run: |
          set -o pipefail
          cordova build android --release --verbose -- --keystore=android.keystore --storePassword="$KEYSTORE_PASSWORD" --alias="$KEYSTORE_ALIAS" --password="$KEYSTORE_PASSWORD" --packageType=apk \
            --gradleArg=--stacktrace --gradleArg=--warning-mode=all 2>&1 | tee build-apk.log

      - name: "[Log] APK output"
        run: |
          ls -lR platforms/android/app/build/outputs/apk || true
          APK=$(ls platforms/android/app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -E "Signer|DN|SHA-256" || true
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" 2>/dev/null | grep -E "^package:|sdkVersion|targetSdkVersion" || true

      - name: Upload Android release APK
        uses: actions/upload-artifact@v5
        with:
          name: android-app-release-apk
          path: platforms/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build Android App Bundle
        run: |
          set -o pipefail
          cordova build android --release --verbose -- --keystore=android.keystore --storePassword="$KEYSTORE_PASSWORD" --alias="$KEYSTORE_ALIAS" --password="$KEYSTORE_PASSWORD" --packageType=bundle \
            --gradleArg=--stacktrace 2>&1 | tee build-aab.log

      - name: "[Log] AAB output"
        run: ls -lR platforms/android/app/build/outputs/bundle || true

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v5
        with:
          name: android-app-release-aab
          path: platforms/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: "[Log] Upload build logs on failure"
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: android-build-logs
          path: |
            build-*.log
            platforms/android/build.gradle
            platforms/android/app/build.gradle
            platforms/android/cdv-gradle-config.json
            platforms/android/gradle.properties
            platforms/android/app/src/main/AndroidManifest.xml
            platforms/android/app/build/reports/
            platforms/android/app/build/outputs/logs/
            plugins/fetch.json
            ~/.npm/_logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up secrets
        if: always()
        run: rm -f android.keystore android-google-services.json

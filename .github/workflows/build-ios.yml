name: Build iOS

on: [workflow_dispatch]

env:
  TEAM_ID: CQHX8VZ8F7
  PROVISIONING_PROFILE: Custom Mobile App Store

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Repo secrets are optional - see samples/README.md.
      # With IOS_CERTIFICATE_BASE64 + IOS_PROVISION_PROFILE_BASE64 -> signed App Store IPA.
      # Without them -> unsigned IPA (must be re-signed before it can be installed).
      BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Determine signing mode
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "SIGNING_MODE=signed" >> $GITHUB_ENV
            echo "[signing] signed - Apple certificate and provisioning profile secrets found"
          else
            echo "SIGNING_MODE=unsigned" >> $GITHUB_ENV
            echo "::warning::IOS_CERTIFICATE_BASE64 / IOS_PROVISION_PROFILE_BASE64 not set - building an UNSIGNED IPA. Re-sign it before installing (see samples/README.md)."
          fi

      - name: "[Log] Available Xcode versions"
        run: ls -d /Applications/Xcode*.app || true

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^26.2'

      - name: Update ios-CFBundleVersion
        run: |
          # update ios-CFBundleVersion
          TIMESTAMP=`date '+%Y%m%d%H%M'`
          sed -i'.bak' "s/ios-CFBundleVersion=\"1.0.0\"/ios-CFBundleVersion=\"${TIMESTAMP}\"/g" config.xml
          rm -f config.xml.bak
          grep -o 'ios-CFBundleVersion="[^"]*"' config.xml

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: "[Log] Environment and toolchain"
        run: |
          echo "::group::Runner"
          sw_vers
          uname -m
          echo "::endgroup::"
          echo "::group::Xcode"
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|iphonesimulator" || true
          echo "::endgroup::"
          echo "::group::Node / npm / Ruby / CocoaPods"
          node --version
          npm --version
          ruby --version
          pod --version || echo "CocoaPods not installed"
          echo "::endgroup::"

      - name: Import GoogleService-Info.plist
        env:
          BUILD_GOOGLESERVICE_PLIST_BASE64: ${{ secrets.IOS_GOOGLESERVICE_PLIST_BASE64 }}
        run: |
          if [ -n "$BUILD_GOOGLESERVICE_PLIST_BASE64" ]; then
            echo "[GoogleService-Info] using secret IOS_GOOGLESERVICE_PLIST_BASE64"
            echo -n "$BUILD_GOOGLESERVICE_PLIST_BASE64" | base64 --decode -o GoogleService-Info.plist
          else
            echo "::warning::IOS_GOOGLESERVICE_PLIST_BASE64 not set - using SAMPLE GoogleService-Info.plist (push notifications will not work)"
            cp samples/ios/GoogleService-Info.plist GoogleService-Info.plist
          fi
          echo "GoogleService-Info.plist BUNDLE_ID: $(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' GoogleService-Info.plist 2>/dev/null)"

      - name: Install Apple certificate and provisioning profile
        if: env.SIGNING_MODE == 'signed'
        env:
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: K3ych@1nP@ssw0rd
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH > /dev/null
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile (both legacy and Xcode 16+ locations)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          cp $PP_PATH ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles

          echo "::group::Code signing identities"
          security find-identity -v -p codesigning $KEYCHAIN_PATH
          if ! security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -q "Apple Distribution"; then
            echo "::warning::No 'Apple Distribution' identity found in keychain - IPA signing will fail"
          fi
          echo "::endgroup::"

          echo "::group::Provisioning profile details"
          security cms -D -i $PP_PATH > $RUNNER_TEMP/profile.plist
          for key in Name UUID TeamIdentifier:0 ExpirationDate Entitlements:application-identifier Entitlements:aps-environment; do
            echo "$key: $(/usr/libexec/PlistBuddy -c "Print :$key" $RUNNER_TEMP/profile.plist 2>/dev/null || echo '-')"
          done
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" $RUNNER_TEMP/profile.plist)
          if [ "$PROFILE_NAME" != "$PROVISIONING_PROFILE" ]; then
            echo "::warning::Provisioning profile name '$PROFILE_NAME' does not match PROVISIONING_PROFILE '$PROVISIONING_PROFILE'"
          fi
          echo "::endgroup::"

      - name: Install Cordova
        run: |
          npm install -g cordova@13.0.0
          cordova --version
          cordova telemetry off

      - name: Add Cordova iOS platform
        run: cordova platform add ios@7.1.0 --verbose

      - name: Add custom cordova-plugin-inappbrowser
        run: cordova plugin add ./cordova-plugin-inappbrowser-download

      - name: Add cordova-plugin-device
        run: cordova plugin add cordova-plugin-device@2.1.0

      - name: Add cordova-plugin-push
        run: cordova plugin add @havesource/cordova-plugin-push@dev

      - name: Add cordova-plugin-statusbar
        run: cordova plugin add cordova-plugin-statusbar@3.0.0

      - name: Add cordova-plugin-media-capture
        run: cordova plugin add cordova-plugin-media-capture@4.0.0

      - name: Add cordova-plugin-dialogs
        run: cordova plugin add cordova-plugin-dialogs@2.0.2

      - name: Add cordova-plugin-vibration
        run: cordova plugin add cordova-plugin-vibration@3.1.1

      - name: Add cordova-plugin-geolocation
        run: cordova plugin add cordova-plugin-geolocation@4.1.0

      - name: Add cordova-plugin-fingerprint-aio
        run: cordova plugin add cordova-plugin-fingerprint-aio@5.0.1

      - name: "[Log] Cordova project state"
        run: |
          echo "::group::cordova info"
          cordova info || true
          echo "::endgroup::"
          echo "::group::cordova platform ls"
          cordova platform ls
          echo "::endgroup::"
          echo "::group::cordova plugin ls"
          cordova plugin ls
          echo "::endgroup::"
          echo "::group::cordova requirements ios"
          cordova requirements ios || echo "::warning::cordova requirements reported problems"
          echo "::endgroup::"
          echo "::group::Podfile"
          cat platforms/ios/Podfile 2>/dev/null || echo "No Podfile"
          echo "::endgroup::"

      - name: Build iOS
        run: |
          set -o pipefail
          cordova build ios --release --verbose 2>&1 | tee build-ios.log

      - name: Upload Xcode workspace
        uses: actions/upload-artifact@v5
        with:
          name: xcworkspace
          path: platforms/ios/

      - name: Build IPA (signed)
        if: env.SIGNING_MODE == 'signed'
        run: |
          set -o pipefail
          # build and export archive as ipa
          cordova build ios --release --device --verbose --codeSignIdentity="Apple Distribution" --developmentTeam="$TEAM_ID" --packageType="app-store-connect" --provisioningProfile="$PROVISIONING_PROFILE" --buildFlag="PROVISIONING_PROFILE_SPECIFIER=$PROVISIONING_PROFILE" --buildFlag="CODE_SIGN_STYLE=Manual" 2>&1 | tee build-ipa.log

      - name: Build IPA (unsigned)
        if: env.SIGNING_MODE == 'unsigned'
        run: |
          set -o pipefail
          WORKSPACE=$(find platforms/ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "[unsigned] workspace: $WORKSPACE, scheme: $SCHEME"

          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" 2>&1 | tee build-ipa.log

          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" | head -1)
          echo "[unsigned] app: $APP"
          OUT_DIR=platforms/ios/build/unsigned
          rm -rf "$RUNNER_TEMP/Payload" && mkdir -p "$RUNNER_TEMP/Payload" "$OUT_DIR"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry "unsigned.ipa" Payload)
          mv "$RUNNER_TEMP/unsigned.ipa" "$OUT_DIR/${SCHEME}-unsigned.ipa"

      - name: "[Log] IPA output"
        run: |
          find platforms/ios/build -name "*.ipa" -exec ls -l {} \;
          cat platforms/ios/exportOptions.plist 2>/dev/null || true
          IPA=$(find platforms/ios/build -name "*.ipa" | head -1)
          if [ -n "$IPA" ]; then
            rm -rf $RUNNER_TEMP/ipa && mkdir -p $RUNNER_TEMP/ipa && unzip -q "$IPA" -d $RUNNER_TEMP/ipa
            APP=$(ls -d $RUNNER_TEMP/ipa/Payload/*.app)
            echo "CFBundleIdentifier: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
            echo "CFBundleShortVersionString: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
            echo "CFBundleVersion: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
            codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier|not signed" || true
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.SIGNING_MODE == 'signed' && 'ios-app-release' || 'ios-app-unsigned' }}
          path: platforms/ios/build/**/*.ipa
          if-no-files-found: error

      - name: "[Log] Upload build logs on failure"
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ios-build-logs
          path: |
            build-*.log
            platforms/ios/Podfile
            platforms/ios/Podfile.lock
            platforms/ios/exportOptions.plist
            platforms/ios/cordova/build-*.xcconfig
            platforms/ios/*/*-Info.plist
            plugins/fetch.json
            ~/Library/Logs/gym/
            ~/.npm/_logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f $RUNNER_TEMP/build_certificate.p12 $RUNNER_TEMP/build_pp.mobileprovision $RUNNER_TEMP/profile.plist
